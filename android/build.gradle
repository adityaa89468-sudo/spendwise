// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << "-Xlint:none"
            options.compilerArgs << "-nowarn"
            options.warnings = false
        }
        tasks.matching { it.name.contains("Kotlin") || it.class.name.contains("Kotlin") }.configureEach { task ->
            try {
                if (task.hasProperty("kotlinOptions")) {
                    task.kotlinOptions.suppressWarnings = true
                }
                if (task.hasProperty("compilerOptions")) {
                    task.compilerOptions.suppressWarnings.set(true)
                }
            } catch (Exception ignored) {
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
